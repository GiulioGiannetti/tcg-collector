<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Pullfolio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#101418;--panel:#161B21;--tile:#1A2027;--tile-hi:#202833;--line:#27313B;--ink:#E8EDF2;--muted:#8A96A3;
  --amber:#FFB547;--amber-ink:#1B1406;--jp:#7FB4FF;--sealed:#C49BFF;--good:#5FD39A;
  --r:14px;box-sizing:border-box;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:inherit}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-size:15px;line-height:1.4}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:linear-gradient(var(--bg) 82%,transparent);padding:12px 0 8px}
.bar{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:"Sora",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.logo svg{width:28px;height:28px}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:14px;font-weight:600}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--tile-hi);color:var(--ink)}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.search{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:100%}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:800;margin-left:4px;text-align:center}
.drawer{display:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px;gap:10px}
.drawer.open{display:grid}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>span{font-size:12px;color:var(--muted);min-width:70px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.chip{border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 2px 10px;flex-wrap:wrap}
.summary b{font-family:"Sora",sans-serif;font-size:22px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:10px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:7px}
  .art{aspect-ratio:93/50;padding:4px}
  .body{padding:6px 8px 7px;gap:1px}
  .name{font-size:12px;line-height:1.2}
  .setlink,.meta,.cond{font-size:10.5px;line-height:1.25}
  .price{padding-top:3px}.price .v{font-size:11.5px}
  .ctl{margin-top:4px}}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:#3A4855}
.art{aspect-ratio:125/96;background:radial-gradient(120% 90% at 50% 20%,#233040 0%,#141A20 70%);display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
.art img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.art .ph{width:62%;aspect-ratio:63/88;border-radius:8px;border:1.5px dashed #34424F;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:6px}
.flags{position:absolute;top:8px;left:8px;display:flex;gap:4px}
.flag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(16,20,24,.85);border:1px solid var(--line)}
.flag.jp{color:var(--jp)}.flag.sealed{color:var(--sealed)}
.qty{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--amber);color:var(--amber-ink)}
.body{padding:8px 9px 9px;display:flex;flex-direction:column;gap:2px;flex:1}
.name{font-weight:700;font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.setlink{background:none;border:0;padding:0;text-align:left;color:var(--muted);font-size:11px;text-decoration:underline;text-decoration-color:#3A4855;text-underline-offset:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond{font-size:10.5px;color:var(--good);font-weight:600}
.price{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.price .v{font-family:"Sora",sans-serif;font-size:12px;color:var(--muted)}
.more{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:800;line-height:1}
.loadmore{display:block;margin:16px auto 0;padding:11px 22px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.empty{grid-column:1/-1;padding:40px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin:60px auto 0;max-width:440px}
.card h1{font-family:"Sora",sans-serif;margin:10px 0 6px}
.card input{width:100%;margin:14px 0 10px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--amber);color:var(--amber-ink);font-weight:800;cursor:pointer}
.btn:disabled{opacity:.5}
.scrim{position:fixed;inset:0;background:rgba(5,7,9,.6);display:none;z-index:20}.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:calc(100dvh - 70px);overflow:auto;overscroll-behavior:contain;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:60;
  padding:18px 18px calc(104px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s;max-width:760px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.tile{transition:none}}
.sheet .hero{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sheet .hero img{width:min(100%,360px);border-radius:12px;cursor:zoom-in;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sheet h2{font-family:"Sora",sans-serif;margin:0 0 6px;font-size:21px;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-top:8px}
.kv span:nth-child(odd){color:var(--muted)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;background:var(--tile)}
.box h3{margin:0 0 6px;font-size:14px}
.close{float:right;border:0;background:var(--tile);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}

.ctl{display:flex;align-items:center;gap:3px;margin-top:5px;min-width:0}
.q{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-weight:800;cursor:pointer;line-height:1}
.qn{min-width:18px;text-align:center;font-weight:800;font-size:12px}
.cartbtn{margin-left:auto;height:24px;width:30px;padding:0;justify-content:center;flex:0 0 auto;border-radius:7px;border:1px solid var(--amber);background:transparent;color:var(--amber);font-weight:800;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px}
.cartbtn svg{width:15px;height:15px}
.price .v.ok{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tile-hi);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:40;font-weight:700;display:none;max-width:90vw}
.toast.show{display:block}
.carts-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.carts-top select{flex:1 1 220px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.sides{grid-template-columns:1fr}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.side h3{margin:0 0 4px;font-family:"Sora",sans-serif;font-size:16px;display:flex;justify-content:space-between}
.side.buy h3 span{color:var(--jp)}.side.sell h3 span{color:var(--good)}
.line{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line img,.line .ph2{width:44px;height:60px;object-fit:contain;border-radius:4px;background:var(--tile)}
.line .nm{font-weight:700;font-size:13.5px;line-height:1.2}
.line .sub{font-size:12px;color:var(--muted)}
.line .tools2{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap}
.pricein{width:96px;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;float:right}
.lt{text-align:right;font-weight:800;font-family:"Sora",sans-serif;font-size:14px}
.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13.5px;align-items:center}
.tot b{font-family:"Sora",sans-serif;text-align:right}
.disc{display:flex;gap:4px;align-items:center}
.disc input{width:70px;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.mode{border:1px solid var(--line);background:var(--tile);border-radius:8px;padding:5px 8px;font-weight:800;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.net{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.net .big{font-family:"Sora",sans-serif;font-size:24px;font-weight:700}
.warn{color:#FF8A7A;font-size:12.5px}
.sidepick{display:flex;gap:6px;flex-wrap:wrap}.sidepick .chip{flex:1;text-align:center}
.field{display:grid;gap:4px;margin-top:12px}.field label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sheet h2{margin-top:0}
.sale{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.sale a{color:var(--ink)}.sale .chip{padding:3px 9px;font-size:11.5px;margin-top:4px}
.seg{overflow-x:auto}.seg button{white-space:nowrap}
.inv{display:grid;gap:12px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{margin:0 0 4px;font-family:"Sora",sans-serif;font-size:16px}
.kpi{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bigv{font-family:"Sora",sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em}
.up{color:var(--good)}.down{color:#FF8A7A}
.ranges{display:flex;gap:4px}.ranges .chip{padding:4px 10px;font-size:12px}
.chart{width:100%;height:auto;display:block}.chart .ax{fill:#8A96A3;font-size:11px;font-family:"Manrope",sans-serif}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pie svg{width:180px;max-width:46%;flex:0 0 auto}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:200px;display:grid;gap:6px;font-size:13px}
.legend li{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px}
.tablewrap{overflow-x:auto}
.rt{width:100%;border-collapse:collapse;font-size:13px;color:var(--ink)}
.rt th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.rt .setlink{font-size:13px;color:var(--ink)}
.news{list-style:none;margin:0;padding:0}.news li{padding:9px 0;border-top:1px solid var(--line)}.news a{color:var(--ink);font-weight:600;text-decoration:none}.news a:hover{text-decoration:underline}
.upc-game{margin-top:10px}.upc-game h4{margin:8px 0 4px;font-family:"Sora",sans-serif;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.upc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--tile)}
.upc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.hot{background:#FFB547;color:#1B1406}.pill.pos{background:#5FD39A;color:#08261A}.pill.watch{background:#7FB4FF;color:#0A1A33}
.pill.mixed{background:#3A4855;color:#E8EDF2}.pill.early{background:transparent;border:1px solid #3A4855;color:#8A96A3}
.sig{margin:4px 0 0;padding-left:0;list-style:none;font-size:12.5px;display:grid;gap:3px}
.src{margin-top:8px;color:var(--muted)}.src a{color:var(--muted)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.pact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.sub4{margin:12px 0 2px;font-size:13px;color:var(--muted)}
.msel{position:relative;flex:1 1 240px;max-width:460px}
.mbtn{width:100%;display:flex;justify-content:space-between;gap:8px;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left}
.mbtn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpanel{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.msearch{width:100%}
.mact{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.mact .chip{padding:4px 10px;font-size:12px}.mdone{margin-left:auto;background:var(--amber)!important;color:var(--amber-ink);border-color:var(--amber)!important}
.mlist{max-height:280px;overflow:auto;display:grid;gap:1px}
.mlist label{display:flex;gap:8px;align-items:center;padding:6px 6px;border-radius:7px;font-size:13px;cursor:pointer}
.mlist label:hover{background:var(--tile)}.mlist input{accent-color:#FFB547;width:16px;height:16px}
.snap{display:grid;gap:2px}
.snap-g{margin:10px 0 2px;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.snap-row{display:grid;grid-template-columns:1fr auto auto 12px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.snap-row:hover{border-color:#3A4855}
.snap-n{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap-d{font-size:12px;color:var(--muted);white-space:nowrap}
.snap-c{color:var(--muted);font-weight:800}
.snap-none{padding:6px 2px}
.sent{font-weight:800;font-size:12.5px;white-space:nowrap}
.sent.hot{color:#FFB547}.sent.pos{color:#5FD39A}.sent.watch{color:#7FB4FF}.sent.mixed{color:#B8C2CC}.sent.early{color:#8A96A3}
.tile.owned{background:linear-gradient(rgba(95,211,154,.10),rgba(95,211,154,.10)),var(--tile);border-color:rgba(95,211,154,.38)}
.tile{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tile .tick{display:none;position:absolute;z-index:3;top:6px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-weight:900;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
body.selecting .tile{outline:1px dashed #3A4855;outline-offset:-1px}
.tile.picked{outline:2.5px solid var(--amber)!important;outline-offset:-2px;background:linear-gradient(rgba(255,181,71,.12),rgba(255,181,71,.12)),var(--tile)}
.tile.picked .tick{display:flex}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--panel);border:1px solid var(--amber);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:900px;margin:0 auto}
.selinfo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.selacts{display:flex;gap:6px;flex-wrap:wrap}.selacts .chip{font-size:12.5px}.selacts .chip:disabled{opacity:.45}
.chip.danger{border-color:#FF8A7A;color:#FF8A7A}
body.selecting .wrap{padding-bottom:140px}
.drawer.open{max-height:calc(100dvh - 200px);overflow-y:auto;overscroll-behavior:contain}
#qual{flex:1 1 240px;max-width:460px}
@media (max-width:600px){
  .mpanel{position:fixed;left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:72dvh;display:flex;flex-direction:column;z-index:50}
  .mpanel[hidden]{display:none}
  .mlist{max-height:none;flex:1;min-height:0}
  .k-card .art{aspect-ratio:133/50}
}
.cline{display:grid;grid-template-columns:1fr 110px 1fr;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.cline .loc{width:100%}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:4px}.pl b{font-family:"Sora",sans-serif;font-size:18px;color:var(--ink)}
.fair{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.fairbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--jp);margin-bottom:8px}.fb-s{background:var(--good);display:block}.fb-b{flex:1;background:var(--jp)}
.warn2{color:#FFB547}
.thumbs{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.thumbs img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thread{display:grid;gap:8px;margin:12px 0;max-height:50vh;overflow:auto}
.msg{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:85%;font-size:13.5px}.msg.me{margin-left:auto;border-color:rgba(255,181,71,.5)}
.stars{display:flex;gap:4px;margin:12px 0}.star{font-size:30px;background:none;border:0;color:#3A4855;cursor:pointer}.star.on{color:#FFB547}
.stat{font-size:12px;color:#FFB547;font-weight:700}
#bell{display:flex;align-items:center;gap:2px}
#bd-url{flex:1 1 260px;font-size:12.5px}
.salebtn{height:24px;width:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-left:auto}
.salebtn.on{background:#5FD39A;border-color:#5FD39A;color:#08261A}
.salebtn + .cartbtn{margin-left:0}
.flag.sale{color:#5FD39A;border-color:rgba(95,211,154,.5)}
.profit{font-size:11px;font-weight:800}

async function fetchAll(table, cols, orderCol){
  const out = []; let from = 0;
  while (from < 200000) { const { data, error } = await sb.from(table).select(cols).order(orderCol).range(from, from + 999);
    if (error || !data || !data.length) break; out.push(...data); if (data.length < 1000) break; from += 1000; }
  return out;
}

    b.onclick = () => { set(v); st.shown = STEP; render(true); }; box.appendChild(b); });
  box._sync = () => box.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(get() === b.dataset.v)));
}
const gameOk = g => !st.games.length || st.games.includes(g);

  st.seriesIds = st.seriesIds.filter(id => serOpts.some(s => String(s.id) === id));
  vsel("ser", "Series", serOpts.map(s => { const ss = vis.filter(x => x.series_id === s.id), a = newestArt(ss);
      const cp = compAgg(ss); return { v:String(s.id), name:s.name, sub:compSub(cp, (oneGame() ? "" : GNAME[s.game_id] + " · ") + ss.length + " set" + (ss.length === 1 ? "" : "s")), logo:s.logo_url, comp:cp }; }), st.seriesIds,
    v => { st.seriesIds = v; st.shown = STEP; render(true); });
  const setOpts = vis.filter(s => !st.seriesIds.length || st.seriesIds.includes(String(s.series_id)))
    .sort((a, b) => String(b.release_date || "").localeCompare(String(a.release_date || "")) || a.name.localeCompare(b.name));

  msel("spc", "Card types", SPECIALS.map(x => [x, x]), st.specials, v => { st.specials = v; st.shown = STEP; render(true); });

  $("fcount").innerHTML = n ? '<span class="badge">' + n + '</span>' : "";
}
// Multi-select dropdown with search: tick any number of options, apply with Done (or by clicking away)
function msel(id, label, opts, sel, onChange){
  const box = $(id); let cur = sel.slice();
  const summary = sel.length === 0 ? "All " + label.toLowerCase() + " (" + opts.length + ")"
    : sel.length === 1 ? ((opts.find(o => o[0] === sel[0]) || [0, "1 selected"])[1]) : sel.length + " " + label.toLowerCase() + " selected";
  box.innerHTML = '<button type="button" class="mbtn" aria-expanded="false"><span>' + esc(summary) + '</span><span aria-hidden="true">▾</span></button>'
    + '<div class="mpanel" hidden><input class="search msearch" type="search" placeholder="Search ' + label.toLowerCase() + '">'
    + '<div class="mact"><button type="button" class="chip" data-m="all">Select shown</button><button type="button" class="chip" data-m="none">Clear</button><button type="button" class="chip mdone" data-m="done">Done</button></div>'
    + '<div class="mlist">' + opts.map(o => '<label><input type="checkbox" value="' + esc(o[0]) + '"' + (sel.includes(o[0]) ? " checked" : "") + '><span>' + esc(o[1]) + '</span></label>').join("") + '</div></div>';
  const btn = box.querySelector(".mbtn"), panel = box.querySelector(".mpanel"), search = box.querySelector(".msearch");
  const same = () => cur.length === sel.length && cur.every(v => sel.includes(v));
  const close = apply => { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); document.removeEventListener("click", outside, true); if (apply && !same()) onChange(cur); };
  const outside = e => { if (!box.contains(e.target)) close(true); };
  btn.onclick = () => { if (panel.hidden) { panel.hidden = false; btn.setAttribute("aria-expanded", "true"); search.focus(); setTimeout(() => document.addEventListener("click", outside, true)); } else close(true); };
  search.oninput = () => { const q = search.value.toLowerCase(); box.querySelectorAll(".mlist label").forEach(l => l.hidden = q && !l.textContent.toLowerCase().includes(q)); };
  box.querySelectorAll(".mlist input").forEach(c => c.onchange = () => { cur = c.checked ? [...new Set(cur.concat(c.value))] : cur.filter(v => v !== c.value); });
  box.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    if (b.dataset.m === "done") return close(true);
    if (b.dataset.m === "none") { cur = []; box.querySelectorAll(".mlist input").forEach(c => c.checked = false); return; }
    box.querySelectorAll(".mlist label:not([hidden]) input").forEach(c => { c.checked = true; cur = [...new Set(cur.concat(c.value))]; });
  });
  box.onkeydown = e => { if (e.key === "Escape") { e.stopPropagation(); close(false); btn.focus(); } };
}

async function renderSold(p, cond, grade){
  const box = $("soldbox"); if (!box) return;
  const { data } = await sb.from("sold_review_v").select("*").eq("product_id", p.id).eq("market", "AU").order("sold_at", { ascending:false }).limit(200);
  const all = data || [];
  const groups = [...new Set(all.map(r => r.condition + "|" + (r.grade || "")))];
  const key = cond + "|" + (grade || "");
  if (!groups.includes(key)) groups.unshift(key);
  const [gc, gg] = key.split("|");
  const mine = all.filter(r => r.condition === gc && (r.grade || "") === gg);
  const cred = mine.filter(r => r.credible), flagged = mine.filter(r => !r.credible);
  const med = priceOf(p, gc, gg), conf = cred.length;
  const fmtDate = d => new Date(d).toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" });
  const saleRow = (r, btn) => '<div class="sale"><div><a href="' + esc(r.url || ebaySoldUrl(p, gc, gg)) + '" target="_blank" rel="noopener">' + esc(r.title || "eBay listing") + '</a>'
    + '<div class="small muted">Sold ' + fmtDate(r.sold_at) + (r.exclusion_reason && !r.credible ? ' · ' + esc(r.exclusion_reason) : '') + (r.user_decision ? ' · you chose to ' + r.user_decision : '') + '</div></div>'
    + '<div style="text-align:right"><b>' + money(+r.price) + '</b><br><button class="chip" data-sale="' + r.id + '" data-dec="' + btn + '">' + (btn === "exclude" ? "Exclude" : "Include") + '</button></div></div>';
  box.innerHTML = '<h3>eBay sold prices</h3>'
    + (groups.length > 1 ? '<select id="soldgrp" style="margin-bottom:8px">' + groups.map(k => { const [c, g] = k.split("|"); return '<option value="' + esc(k) + '"' + (k === key ? " selected" : "") + '>' + esc((COND[c] || c) + (g ? " · " + g : "")) + '</option>'; }).join("") + '</select>' : "")
    + (med != null ? '<div class="big" style="font-family:Sora,sans-serif;font-size:26px;font-weight:700">' + money(med) + '</div><div class="small muted">Median of the latest ' + Math.min(conf, 10) + ' credible eBay AU sales' + (conf < 4 ? ' · low confidence (few sales)' : '') + '</div>'
                  : '<div class="small muted">No credible eBay AU sales recorded yet for ' + esc((COND[gc] || gc) + (gg ? " · " + gg : "")) + '.</div>')
    + (cred.length ? '<h4 style="margin:12px 0 4px">Last 3 credible sales</h4>' + cred.slice(0, 3).map(r => saleRow(r, "exclude")).join("") : "")
    + (flagged.length ? '<details style="margin-top:10px"><summary class="small">' + flagged.length + ' sale(s) excluded as outliers — review</summary>' + flagged.map(r => saleRow(r, "include")).join("") + '</details>' : "");
  if ($("soldgrp")) $("soldgrp").onchange = e => { const [c, g] = e.target.value.split("|"); renderSold(p, c, g); };
  box.querySelectorAll("[data-sale]").forEach(b => b.onclick = async () => {
    const { error } = await sb.from("sold_listings").update({ user_decision: b.dataset.dec, decided_at: new Date().toISOString() }).eq("id", +b.dataset.sale);
    if (error) return toast(error.message);
    const { data:pr } = await sb.from("price_v").select("product_id,condition,grade,median,sales,last_sold").eq("product_id", p.id);
    [...st.prices.keys()].filter(k => k.startsWith(p.id + "|")).forEach(k => st.prices.delete(k));
    (pr || []).forEach(r => st.prices.set(r.product_id + "|" + r.condition + "|" + (r.grade || ""), r));
    toast(b.dataset.dec === "exclude" ? "Sale excluded from pricing" : "Sale included in pricing");
    renderSold(p, gc, gg);
  });
}

async function bulk(action){
  const items = [...st.sel.values()];
  if (action === "cancel") return endSelect();
  if (!items.length) return;
  if (action === "add") {
    for (const it of items) { const { error } = await sb.rpc("adjust_collection", { p_product: it.p.id, p_condition: it.cond || "NM", p_grade: it.grade || "", p_delta: 1 }); if (error) return toast(error.message); }
    await loadCollection(); st.snaps = null; toast("Added " + items.length + " item(s) to your collection");
  } else if (action === "remove") {
    const coll = st.tab === "collection";
    if (!confirm(coll ? "Delete " + items.length + " line(s) from your collection? This removes every copy in those lines." : "Remove 1 copy of each of " + items.length + " item(s) from your collection?")) return;
    for (const it of items) { const have = ownedQty(it.p.id, it.cond, it.grade); const d = coll ? -it.qty : -1; if (!have) continue;
      const { error } = await sb.rpc("adjust_collection", { p_product: it.p.id, p_condition: it.cond, p_grade: it.grade || "", p_delta: Math.max(d, -have) }); if (error) return toast(error.message); }
    await loadCollection(); st.snaps = null; toast("Collection updated");
  } else if (action === "cart") return bulkCart(items);
  else if (action === "list") {
    await loadSocial(); if (!st.profile) return toast("Set up your profile in the Friends tab first");
    let ok = 0, skipped = 0;
    for (const it of items) { if (!ownedQty(it.p.id, it.cond, it.grade)) { skipped++; continue; }
      const { error } = await sb.from("listings").insert({ product_id: it.p.id, condition: it.cond || "NM", grade: it.grade || "", quantity: 1, mode: "sale", price: priceOf(it.p, it.cond, it.grade) });
      if (error) skipped++; else ok++; }
    toast("Listed " + ok + " for your followers" + (skipped ? " · " + skipped + " skipped (not owned)" : ""));
  }
  endSelect(); render(false);
}

function fairness(B, S){
  const big = Math.max(B.total, S.total);
  if (!big) return "";
  const diff = S.total - B.total, pct = Math.abs(diff) / big * 100, fair = pct <= 5;
  const msg = fair ? "Fair trade: within 5%" : diff > 0 ? "You're giving " + money(diff) + " more (" + pct.toFixed(0) + "%). Ask for " + money(diff) + " cash to balance" : "You're receiving " + money(-diff) + " more (" + pct.toFixed(0) + "%). Add " + money(-diff) + " cash to balance";
  return '<div class="fair"><div class="fairbar"><span class="fb-s" style="width:' + (S.total / (B.total + S.total) * 100).toFixed(1) + '%"></span><span class="fb-b"></span></div>'
    + '<div class="row small" style="justify-content:space-between"><span>You give ' + money(S.total) + '</span><b class="' + (fair ? "up" : "warn2") + '">' + msg + '</b><span>You get ' + money(B.total) + '</span></div></div>';

// selling costs used for profit: eBay final value fee %, fixed fee per order, postage per item (editable in Investment → Profit & loss)
function sellCosts(){ const n = (k, d) => { const v = parseFloat(localStorage.getItem(k)); return isNaN(v) ? d : v; };
  return { pct: n("sell.feePct", 13.4), fixed: n("sell.feeFixed", 0.30), post: n("sell.post", 3.00) }; }
// profit per copy = sold median − selling fees − postage − what you paid
function profitOf(p, line){
  if (!p || !line || line.cost_paid == null) return null;
  const v = valueOf(p, line.condition, line.grade); if (v == null) return null;
  const c = sellCosts();
  return Math.round((v - v * c.pct / 100 - c.fixed - c.post - +line.cost_paid) * 100) / 100;
}

  const s = setOf(p).name;
  const q = line && line.grade ? line.grade : (p.kind === "sealed" ? "Sealed" : (line && line.condition === "NM" ? "NM" : line ? (COND[line.condition] || line.condition) : "NM"));
  const parts = [clean(p.name), clean(p.card_number), clean(s && !clean(p.name).toLowerCase().includes(clean(s).toLowerCase()) ? s : ""), q, p.language === "JP" ? "Japanese" : "", GAME_TITLE[p.game_id] || ""].filter(Boolean);
  const order = [5, 2, 4];          // drop game label, then set, then "Japanese" until it fits
  let keep = parts.map(() => true), title = parts.join(" ");
  for (const i of order) { if (title.length <= 80) break; if (parts[i] !== undefined) { keep[i] = false; title = parts.filter((_, k) => keep[k]).join(" "); } }
  return title.length > 80 ? title.slice(0, 80).replace(/\s+\S*$/, "") : title;
}

const netVal = (p, cond, grade) => { const v = p ? priceOf(p, cond || "NM", grade || "") : null; if (v == null) return null; const c = sellCosts(); return v - v * c.pct / 100 - c.fixed; };
async function openTradeBuilder(friendId){

  const tIds = [...new Set((theirs || []).map(t => t.product_id))];

  const mine = st.col.filter(c => c.products && (c.for_sale || fw.some(w => w.product_id === c.products.id)))

    if (best < 0) break; set.add(best); }

    + '<div class="small muted">Suggested swap is pre-ticked: their cards on your wishlist for your cards on theirs, balanced at net value (after selling fees). Adjust as you like.</div>'
    + '<h4 class="sub4">You get (their for-sale cards)</h4>' + (their.length ? their.map((x, i) => row(x, i, "t", pickT)).join("") : '<div class="small muted">They have nothing marked for sale.</div>')
    + '<h4 class="sub4">You give (your for-sale cards and cards they want)</h4>' + (mine.length ? mine.map((x, i) => row(x, i, "m", pickM)).join("") : '<div class="small muted">Mark cards for sale, or they need wishlist cards you own.</div>')
    + '<div id="tb-fair"></div><input class="search" id="tb-msg" maxlength="500" placeholder="Message (optional)" style="width:100%;margin-top:8px"><p></p><button class="btn" id="tb-send">Send proposal</button>';

  const upd = () => { const gT = sel("t").reduce((n, i) => n + (netVal(their[i].p, their[i].condition, their[i].grade) || 0), 0), gM = sel("m").reduce((n, i) => n + (netVal(mine[i].p, mine[i].condition, mine[i].grade) || 0), 0);

const SLICE = { "pokemon":["#FFB547","#FFE0A8"], "one-piece":["#FF6B6B","#FFB8B8"], "dragon-ball":["#5FD39A","#B2EDCF"], "magic":["#7FB4FF","#C6DCFF"], "yugioh":["#C49BFF","#E4D4FF"] };

function lineChart(pts){
  if (pts.length < 2) return '<div class="small muted" style="padding:24px 4px">Your value history starts building now: a point is added every night. Once eBay is connected, about 13 weeks of weekly history is filled in from past sales.</div>';
  const W = 640, H = 220, L = 8, R = 8, T = 14, B = 26, vals = pts.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo = Math.max(0, lo - 1); }
  const t0 = new Date(pts[0].day).getTime(), t1 = new Date(pts[pts.length - 1].day).getTime() || t0 + 1;
  const x = d => L + (W - L - R) * ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const line = pts.map((p, i) => (i ? "L" : "M") + x(p.day).toFixed(1) + " " + y(p.value).toFixed(1)).join(" ");
  const area = line + " L" + x(pts[pts.length - 1].day).toFixed(1) + " " + (H - B) + " L" + x(pts[0].day).toFixed(1) + " " + (H - B) + " Z";
  const fmtD = d => new Date(d).toLocaleDateString("en-AU", { day:"numeric", month:"short" });

    + '<defs><linearGradient id="gfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFB547" stop-opacity=".35"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient></defs>'
    + [0, .5, 1].map(f => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + (H - T - B) * f) + '" y2="' + (T + (H - T - B) * f) + '" stroke="#27313B"/>').join("")
    + '<path d="' + area + '" fill="url(#gfill)"/><path d="' + line + '" fill="none" stroke="#FFB547" stroke-width="2.5" stroke-linejoin="round"/>'
    + '<text x="' + L + '" y="' + (T - 3) + '" class="ax">' + money(hi) + '</text><text x="' + L + '" y="' + (H - B - 4) + '" class="ax">' + money(lo) + '</text>'
    + '<text x="' + L + '" y="' + (H - 6) + '" class="ax">' + fmtD(pts[0].day) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" class="ax" text-anchor="end">' + fmtD(pts[pts.length - 1].day) + '</text></svg>';
}
function donut(slices, byValue){
  const total = slices.reduce((n, s) => n + (byValue ? s.value : s.items), 0);
  if (!total) return '<div class="small muted">Nothing matches these filters.</div>';
  const R = 70, r = 44, C = 90; let a0 = -Math.PI / 2, paths = "";
  const pt = (rad, a) => (C + rad * Math.cos(a)).toFixed(2) + " " + (C + rad * Math.sin(a)).toFixed(2);
  slices.forEach(s => {
    const share = (byValue ? s.value : s.items) / total; if (share <= 0) return;
    const col = SLICE[s.game][s.kind === "sealed" ? 1 : 0];
    if (share >= 0.9999) { paths += '<circle cx="' + C + '" cy="' + C + '" r="' + ((R + r) / 2) + '" fill="none" stroke="' + col + '" stroke-width="' + (R - r) + '"/>'; return; }
    const a1 = a0 + share * 2 * Math.PI, big = share > .5 ? 1 : 0;
    paths += '<path d="M' + pt(R, a0) + ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + pt(R, a1) + ' L' + pt(r, a1) + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + pt(r, a0) + ' Z" fill="' + col + '" stroke="#101418" stroke-width="1.5"><title>' + esc(GNAME[s.game] + " · " + (s.kind === "sealed" ? "Sealed" : "Cards")) + '</title></path>';
    a0 = a1;
  });
  const legend = slices.filter(s => (byValue ? s.value : s.items) > 0).map(s => {
    const share = (byValue ? s.value : s.items) / total;
    return '<li><span class="sw" style="background:' + SLICE[s.game][s.kind === "sealed" ? 1 : 0] + '"></span><span>' + esc(GNAME[s.game]) + ' · ' + (s.kind === "sealed" ? "Sealed" : "Cards") + '</span><b>' + (share * 100).toFixed(1) + '%</b><span class="muted">' + (byValue ? money(s.value) : s.items.toLocaleString() + " items") + '</span></li>'; }).join("");
  return '<div class="pie"><svg viewBox="0 0 180 180" role="img" aria-label="Portfolio split by game and type">' + paths + '</svg><ul class="legend">' + legend + '</ul></div>';
}

  const P = st.profile || {}, contact = st.contacts && st.contacts.get(st.me) || "";
  v.innerHTML = '<section class="panel" style="margin-top:14px;max-width:520px"><h3>' + (st.profile ? "Edit your profile" : "Set up your profile") + '</h3><div class="small muted">Friends and organisations find you by your handle. Your contact detail is only shown to people you\'re connected with.</div>'
    + '<div class="field"><label>Handle</label><input class="search" id="pf-h" value="' + esc(P.handle || "") + '" placeholder="e.g. giulio_tcg" ' + (st.profile ? "disabled" : "") + '><span class="small muted">3–20 lowercase letters, numbers or _</span></div>'
    + '<div class="field"><label>Display name</label><input class="search" id="pf-n" value="' + esc(P.display_name || "") + '"></div>'
    + '<div class="field"><label>Type</label><select id="pf-k"><option value="person"' + (P.kind !== "organisation" ? " selected" : "") + '>Person</option><option value="organisation"' + (P.kind === "organisation" ? " selected" : "") + '>Organisation / shop</option></select></div>'
    + '<div class="field"><label>Bio (optional)</label><input class="search" id="pf-b" value="' + esc(P.bio || "") + '" maxlength="280"></div>'
    + '<div class="field"><label>Contact for connections (optional)</label><input class="search" id="pf-c" value="' + esc(contact) + '" maxlength="200" placeholder="e.g. Instagram @handle or phone"></div>'
    + '<p class="warn" id="pf-err"></p><button class="btn" id="pf-save">Save</button>' + (st.profile ? ' <button class="iconbtn" id="pf-cancel">Cancel</button>' : "") + '</section>';
  if ($("pf-cancel")) $("pf-cancel").onclick = () => renderFriends();
  $("pf-save").onclick = async () => {
    const row = { display_name: $("pf-n").value.trim(), kind: $("pf-k").value, bio: $("pf-b").value.trim() || null };
    let res;
    if (st.profile) res = await sb.from("profiles").update(row).eq("id", st.me);
    else { row.handle = $("pf-h").value.trim().toLowerCase(); res = await sb.from("profiles").insert(row); }
    if (res.error) { $("pf-err").textContent = /duplicate|unique/i.test(res.error.message) ? "That handle is taken." : /check/i.test(res.error.message) ? "Handle must be 3–20 lowercase letters, numbers or _, and a name is required." : res.error.message; return; }
    const c = $("pf-c").value.trim();
    await sb.from("profile_contacts").upsert({ id: st.me, contact: c || null });
    toast("Profile saved"); renderFriends();
  };
}
async function searchPeople(q){
  const el = $("presults"); if (!el) return;
  if (q.length < 2) { el.innerHTML = ""; return; }
  const t = q.replace(/^@/, "").replace(/[,()*%]/g, " ");
  const { data } = await sb.from("profiles").select("*").or("handle.ilike.*" + t + "*,display_name.ilike.*" + t + "*").neq("id", st.me).limit(20);
  el.innerHTML = (data || []).map(p => { st.people.set(p.id, p);
    const f = st.follows.find(x => x.follower === st.me && x.followee === p.id);
    const act = !f ? '<button class="chip" data-fa="follow" data-u="' + p.id + '">Follow</button>' : f.status === "pending" ? '<span class="small muted">Requested</span>' : '<span class="small muted">Following</span>';
    return '<div class="prow"><div>' + who(p.id) + (p.bio ? '<div class="small muted">' + esc(p.bio) + '</div>' : "") + '</div><div class="pact">' + act + '</div></div>'; }).join("") || '<div class="small muted">No one found.</div>';
  el.querySelectorAll("[data-fa]").forEach(b => b.onclick = () => followAction(b.dataset.fa, b.dataset.u));
}
async function followAction(a, u){
  let res;
  if (a === "follow") res = await sb.from("follows").insert({ followee: u });
  else if (a === "accept") res = await sb.from("follows").update({ status:"accepted" }).eq("follower", u).eq("followee", st.me);
  else if (a === "reject" || a === "remove") res = await sb.from("follows").delete().eq("follower", u).eq("followee", st.me);
  else if (a === "cancel" || a === "unfollow") res = await sb.from("follows").delete().eq("follower", st.me).eq("followee", u);
  if (res && res.error) return toast(res.error.message);
  toast({ follow:"Request sent", accept:"Accepted", reject:"Declined", remove:"Removed", cancel:"Request cancelled", unfollow:"Unfollowed" }[a]);
  renderFriends();
}
function openOffer(l){
  if (!l) return; const p = l.products || {};
  $("sheet").innerHTML = '<button class="close" id="x" aria-label="Close">×</button><h2>Make an offer</h2><div class="small muted">' + esc(p.name || "") + ' · ' + esc(COND[l.condition] || l.condition) + ' · ×' + l.quantity + ' available · listed ' + (l.price != null ? "at " + money(+l.price) : "for offers") + '</div><div class="small">' + who(l.owner_id) + '</div>'
    + '<div class="field"><label>Quantity</label><input class="search" id="of-q" type="number" min="1" max="' + l.quantity + '" value="1"></div>'
    + '<div class="field"><label>Your price each (AUD)</label><input class="search" id="of-p" inputmode="decimal" value="' + (l.price != null ? (+l.price).toFixed(2) : "") + '"></div>'
    + '<div class="field"><label>Message (optional)</label><input class="search" id="of-m" maxlength="500" placeholder="e.g. Can pay by bank transfer, Melbourne pickup ok"></div>'
    + '<p class="small muted">Payment and postage are arranged directly with the seller after they accept.</p><button class="btn" id="of-send">Send offer</button>';
  $("x").onclick = closeSheet; $("scrim").classList.add("open"); $("sheet").classList.add("open");
  $("of-send").onclick = async () => {
    const q = Math.max(1, Math.min(l.quantity, +$("of-q").value || 1)), pr = $("of-p").value.trim() === "" ? null : Math.max(0, +$("of-p").value.replace(/[^0-9.]/g, ""));
    const { error } = await sb.from("offers").insert({ listing_id: l.id, quantity: q, price: pr, message: $("of-m").value.trim() || null, seller_id: l.owner_id });
    if (error) return toast(error.message);
    closeSheet(); toast("Offer sent"); renderFriends();

}
function openListing(p, owned){
  const opts = owned.map(c => ({ key: c.condition + "|" + (c.grade || ""), label: (COND[c.condition] || c.condition) + (c.grade ? " · " + c.grade : ""), have: c.quantity }));
  $("sheet").innerHTML = '<button class="close" id="x" aria-label="Close">×</button><h2>List for friends</h2><div class="small muted">' + esc(p.name) + ' · only your accepted followers will see this</div>'
    + '<div class="field"><label>Copy</label><select id="ls-c">' + opts.map(o => '<option value="' + esc(o.key) + '">' + esc(o.label) + ' (you own ' + o.have + ')</option>').join("") + '</select></div>'
    + '<div class="field"><label>Quantity</label><input class="search" id="ls-q" type="number" min="1" value="1"></div>'
    + '<div class="field"><label>Type</label><select id="ls-m"><option value="sale">For sale</option><option value="trade">For trade</option><option value="either">Sale or trade</option></select></div>'
    + '<div class="field"><label>Price each (AUD, leave blank for offers)</label><input class="search" id="ls-p" inputmode="decimal" value="' + (priceOf(p, owned[0].condition, owned[0].grade) != null ? priceOf(p, owned[0].condition, owned[0].grade).toFixed(2) : "") + '"></div>'
    + '<div class="field"><label>Note (optional)</label><input class="search" id="ls-n" maxlength="280"></div>'
    + '<div class="field"><label>Condition photos (optional, up to 4)</label><input type="file" id="ls-ph" accept="image/jpeg,image/png,image/webp" multiple></div>'
    + '<p class="warn" id="ls-err"></p><button class="btn" id="ls-save">List it</button>';
  $("x").onclick = closeSheet;
  $("ls-save").onclick = async () => {
    if (!st.profile) { await loadSocial(); if (!st.profile) { $("ls-err").textContent = "Set up your profile in the Friends tab first."; return; } }
    const [c, g] = $("ls-c").value.split("|");
    const row = { product_id: p.id, condition: c, grade: g || "", quantity: Math.max(1, +$("ls-q").value || 1), mode: $("ls-m").value,
      price: $("ls-p").value.trim() === "" ? null : Math.max(0, +$("ls-p").value.replace(/[^0-9.]/g, "")), note: $("ls-n").value.trim() || null };
    const ph = $("ls-ph").files; if (ph && ph.length) { $("ls-save").disabled = true; $("ls-save").textContent = "Uploading photos…"; row.photos = await uploadPhotos(ph); }
    const { error } = await sb.from("listings").insert(row);
    if (error) { $("ls-err").textContent = error.message; return; }
    closeSheet(); toast("Listed for your followers");
  };
}
function updateBadges(){ const b = $("frcount"); if (b) b.innerHTML = st.socialBadge ? ' <span class="badge">' + st.socialBadge + '</span>' : ""; }

// ---------- carts ----------
async function loadCarts(){
  const { data } = await sb.from("carts").select("*").order("created_at", { ascending:false });
  st.carts = data || [];
  if (!st.carts.some(c => c.id === st.cartId)) st.cartId = (st.carts.find(c => c.status === "open") || st.carts[0] || {}).id || null;
  await loadCartItems();
}
async function loadCartItems(){
  if (!st.cartId) { st.cartItems = []; return; }
  const { data } = await sb.from("cart_items").select("*,products(" + PCOLS + ")").eq("cart_id", st.cartId).order("id");
  st.cartItems = data || [];
  try { localStorage.setItem("activeCart", st.cartId); } catch (e) {}
}
async function newCart(){
  const name = prompt("Name this cart", "Trade " + new Date().toLocaleDateString("en-AU"));
  if (!name) return null;
  const { data, error } = await sb.from("carts").insert({ name }).select().single();
  if (error) { toast(error.message); return null; }
  st.carts.unshift(data); st.cartId = data.id; await loadCartItems(); return data;
}
function openAddToCart(p, cond, grade){
  if (!p) return;
  const open = st.carts.filter(c => c.status === "open");
  const conds = ["NM","LP","MP","HP","DMG"].concat(cond && !COND[cond] ? [cond] : []);
  $("sheet").innerHTML = '<button class="close" id="x" aria-label="Close">×</button><h2>Add to cart</h2><div class="muted small">' + esc(p.name) + ' · ' + esc(setOf(p).name || "") + '</div>'
    + '<div class="field"><label>Cart</label><select id="ac-cart">' + open.map(c => '<option value="' + c.id + '"' + (c.id === st.cartId ? " selected" : "") + '>' + esc(c.name) + '</option>').join("") + '<option value="new">+ New cart…</option></select></div>'
    + '<div class="field"><label>Side</label><div class="sidepick"><button class="chip" data-side="buy" aria-pressed="true">Buy (adding to collection)</button><button class="chip" data-side="sell" aria-pressed="false">Sell (from collection)</button></div></div>'
    + '<div class="field"><label>Condition</label><select id="ac-cond">' + conds.map(k => '<option value="' + esc(k) + '"' + (k === cond ? " selected" : "") + '>' + esc(COND[k] || k) + '</option>').join("") + '</select></div>'
    + '<div class="field"><label>Quantity</label><div class="ctl"><button class="q" id="ac-dec">−</button><span class="qn" id="ac-q">1</span><button class="q" id="ac-inc">+</button><span class="small muted" id="ac-own" style="margin-left:8px"></span></div></div>'
    + '<p class="warn" id="ac-warn"></p><button class="btn" id="ac-add">Add to cart</button>';
  let side = "buy", qty = 1;
  const upd = () => { const c = $("ac-cond").value, have = ownedQty(p.id, c, grade);
    $("ac-q").textContent = qty; $("ac-own").textContent = "You own " + have + " in this condition";
    $("ac-warn").textContent = side === "sell" && qty > have ? "You'll need " + qty + " in your collection to complete this sale." : ""; };
  document.querySelectorAll(".sidepick .chip").forEach(b => b.onclick = () => { side = b.dataset.side; document.querySelectorAll(".sidepick .chip").forEach(x => x.setAttribute("aria-pressed", String(x === b))); upd(); });
  $("ac-dec").onclick = () => { qty = Math.max(1, qty - 1); upd(); }; $("ac-inc").onclick = () => { qty++; upd(); }; $("ac-cond").onchange = upd;
  $("ac-add").onclick = async () => {
    let cartId = $("ac-cart").value;
    if (cartId === "new") { const c = await newCart(); if (!c) return; cartId = c.id; } else cartId = +cartId;
    if (st.cartId !== cartId) { st.cartId = cartId; await loadCartItems(); }
    const c = $("ac-cond").value;
    const ex = st.cartItems.find(i => i.product_id === p.id && i.side === side && i.condition === c && (i.grade || "") === (grade || ""));
    const res = ex ? await sb.from("cart_items").update({ quantity: ex.quantity + qty }).eq("id", ex.id)
                   : await sb.from("cart_items").insert({ cart_id: cartId, product_id: p.id, side, condition: c, grade: grade || "", quantity: qty });
    if (res.error) return toast(res.error.message);
    await loadCartItems(); closeSheet(); render(false);
    toast("Added to " + (side === "buy" ? "Buy" : "Sell") + " in " + (st.carts.find(x => x.id === cartId) || {}).name);
  };
  upd(); $("x").onclick = closeSheet; $("scrim").classList.add("open"); $("sheet").classList.add("open");
}
const unitOf = i => i.unit_price != null ? +i.unit_price : priceOf(i.products, i.condition, i.grade);
function sideTotals(side, cart){
  const items = st.cartItems.filter(i => i.side === side);
  let sub = 0, unpriced = 0;
  items.forEach(i => { const u = unitOf(i); if (u == null) unpriced++; else sub += u * i.quantity; });
  const d = +cart[side + "_discount"] || 0, mode = cart[side + "_discount_mode"];
  const total = mode === "%" ? sub * (1 - Math.min(d, 100) / 100) : Math.max(0, sub - d);
  return { items, sub, total, unpriced, disc: sub - total };
}
function renderCarts(){
  const v = $("cartview");
  if (!st.carts.length) { v.innerHTML = '<div class="empty" style="margin-top:14px"><b>No items here yet.</b><br><span class="small">Use the <b>Cart</b> button on any card, or start a cart here.</span><br><br><button class="btn" id="nc">New cart</button></div>';
    $("nc").onclick = async () => { await newCart(); render(false); }; return; }
  const cart = st.carts.find(c => c.id === st.cartId) || st.carts[0];
  const done = cart.status === "completed";
  const B = sideTotals("buy", cart), S = sideTotals("sell", cart), net = S.total - B.total;
  const lineHTML = i => { const p = i.products || {}, u = priceOf(p, i.condition, i.grade), eff = unitOf(i);
    return '<div class="line" data-item="' + i.id + '">' + (p.image_url ? '<img alt="" src="' + esc(p.image_url) + '">' : '<div class="ph2"></div>')
      + '<div><div class="nm">' + esc(p.name) + '</div><div class="sub">' + esc(setOf(p).name || "") + (p.card_number ? " · " + esc(p.card_number) : "") + ' · ' + esc(COND[i.condition] || i.condition) + (p.language === "JP" ? " · JP" : "") + '</div>'
      + '<div class="tools2">' + (done ? '<span class="small muted">× ' + i.quantity + '</span>' : '<button class="q" data-li="dec">−</button><span class="qn">' + i.quantity + '</span><button class="q" data-li="inc">+</button>')
      + '<input class="pricein" data-li="price" inputmode="decimal" ' + (done ? "disabled " : "") + 'placeholder="' + (u != null ? "eBay " + u.toFixed(2) : "Price") + '" value="' + (i.unit_price != null ? (+i.unit_price).toFixed(2) : "") + '" aria-label="Unit price (AUD)"></div></div>'
      + '<div><div class="lt">' + (eff != null ? money(eff * i.quantity) : '<span class="warn">' + (PRICE_FALLBACK_ASKING ? "Needs sold data" : "No price") + '</span>') + '</div>' + (done ? "" : '<button class="x" data-li="rm" aria-label="Remove from cart">×</button>') + '</div></div>'; };
  const sideHTML = (side, T, label, hint) => '<div class="side ' + side + '"><h3>' + label + ' <span>' + money(T.total) + '</span></h3><div class="small muted">' + hint + '</div>'
    + (T.items.length ? T.items.map(lineHTML).join("") : '<div class="small muted" style="padding:12px 0">Nothing here yet.</div>')
    + '<div class="tot"><span>Subtotal (' + T.items.reduce((n, i) => n + i.quantity, 0) + ' items)</span><b>' + money(T.sub) + '</b>'
    + '<span class="disc">Discount <input data-disc="' + side + '" inputmode="decimal" ' + (done ? "disabled " : "") + 'value="' + (+cart[side + "_discount"] || "") + '" placeholder="0">'
    + '<button class="mode" data-mode="' + side + '" data-m="%" aria-pressed="' + (cart[side + "_discount_mode"] === "%") + '"' + (done ? " disabled" : "") + '>%</button><button class="mode" data-mode="' + side + '" data-m="$" aria-pressed="' + (cart[side + "_discount_mode"] === "$") + '"' + (done ? " disabled" : "") + '>$</button></span><b>−' + money(T.disc) + '</b>'
    + '<span>Total</span><b>' + money(T.total) + '</b></div>' + (T.unpriced ? '<div class="warn">' + T.unpriced + ' line(s) have no price yet — enter one to include them.</div>' : "") + '</div>';
  v.innerHTML = '<div class="carts-top"><select id="cartsel" aria-label="Choose cart">' + st.carts.map(c => '<option value="' + c.id + '"' + (c.id === cart.id ? " selected" : "") + '>' + (c.status === "completed" ? "✓ " : "") + esc(c.name) + '</option>').join("") + '</select>'
    + '<button class="iconbtn" id="cnew">New</button>' + (done ? "" : '<button class="iconbtn" id="cren">Rename</button>') + '<button class="iconbtn" id="cdel">Delete</button></div>'
    + (done ? '<p class="small muted">Completed ' + new Date(cart.completed_at).toLocaleString("en-AU") + '. Your collection was updated.</p>' : "")
    + '<div class="sides">' + sideHTML("buy", B, "Buy", "Items you're getting — added to your collection on Proceed.") + sideHTML("sell", S, "Sell", "Items you're giving — removed from your collection on Proceed.") + '</div>'
    + fairness(B, S)
    + (PRICE_FALLBACK_ASKING && B.unpriced + S.unpriced ? '<div class="warn" id="netwarn">Needs sold data: ' + (B.unpriced + S.unpriced) + ' line(s) left out of the net. Asking prices are never used here.</div>' : "")
    + '<div class="net"><div><div class="small muted">Sell ' + money(S.total) + ' − Buy ' + money(B.total) + '</div><div class="big" style="color:' + (net >= 0 ? "var(--good)" : "#FF8A7A") + '">' + (net >= 0 ? "You receive " : "You pay ") + money(Math.abs(net)) + '</div></div>'
    + (done ? "" : '<button class="btn" id="proceed"' + (B.items.length + S.items.length ? "" : " disabled") + '>Proceed</button>') + '</div>';
  $("cartsel").onchange = async e => { st.cartId = +e.target.value; await loadCartItems(); renderCarts(); };
  $("cnew").onclick = async () => { await newCart(); render(false); };
  if ($("cren")) $("cren").onclick = async () => { const n = prompt("Rename cart", cart.name); if (!n) return; await sb.from("carts").update({ name:n }).eq("id", cart.id); cart.name = n; renderCarts(); };
  $("cdel").onclick = async () => { if (!confirm("Delete the cart \"" + cart.name + "\"? This only deletes the cart, not anything in your collection.")) return;
    await sb.from("carts").delete().eq("id", cart.id); st.carts = st.carts.filter(c => c.id !== cart.id); st.cartId = null; await loadCarts(); render(false); };
  v.querySelectorAll(".line").forEach(el => {
    const it = st.cartItems.find(i => i.id === +el.dataset.item);
    el.querySelectorAll("[data-li]").forEach(b => {
      const a = b.dataset.li;
      if (a === "price") { b.onchange = async () => { const val = b.value.trim() === "" ? null : Math.max(0, +b.value.replace(/[^0-9.]/g, ""));
        await sb.from("cart_items").update({ unit_price: val }).eq("id", it.id); it.unit_price = val; renderCarts(); }; return; }
      b.onclick = async () => {
        if (a === "rm") { await sb.from("cart_items").delete().eq("id", it.id); st.cartItems = st.cartItems.filter(i => i.id !== it.id); return render(false); }
        const q = it.quantity + (a === "inc" ? 1 : -1); if (q < 1) return;
        await sb.from("cart_items").update({ quantity:q }).eq("id", it.id); it.quantity = q; renderCarts();
      };
    });
  });
  v.querySelectorAll("[data-disc]").forEach(inp => inp.onchange = async () => { const side = inp.dataset.disc, val = Math.max(0, +inp.value.replace(/[^0-9.]/g, "") || 0);
    await sb.from("carts").update({ [side + "_discount"]: val }).eq("id", cart.id); cart[side + "_discount"] = val; renderCarts(); });
  v.querySelectorAll("[data-mode]").forEach(b => b.onclick = async () => { const side = b.dataset.mode;
    await sb.from("carts").update({ [side + "_discount_mode"]: b.dataset.m }).eq("id", cart.id); cart[side + "_discount_mode"] = b.dataset.m; renderCarts(); });
  if ($("proceed")) $("proceed").onclick = async () => {
    const short = S.items.filter(i => i.quantity > ownedQty(i.product_id, i.condition, i.grade));
    if (short.length) return toast("Not enough in your collection for: " + short.map(i => i.products.name).join(", "));
    if (!confirm("Proceed with \"" + cart.name + "\"?\n\nAdds " + B.items.reduce((n, i) => n + i.quantity, 0) + " item(s) to your collection and removes " + S.items.reduce((n, i) => n + i.quantity, 0) + ".\nNet: " + (net >= 0 ? "you receive " : "you pay ") + money(Math.abs(net)))) return;
    $("proceed").disabled = true;
    const { error } = await sb.rpc("complete_cart", { p_cart: cart.id });
    if (error) { $("proceed").disabled = false; return toast(error.message); }
    await Promise.all([loadCollection(), loadCarts()]);
    toast("Done — your collection has been updated"); render(false);
  };
}
$("scrim").onclick = closeSheet; document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); if (st.drawer && !document.querySelector(".fpop-scrim")) setDrawer(false); } });
init();
